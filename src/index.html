<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png" />

    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body
    class="font-outfit flex flex-col justify-center items-center min-h-screen bg-very-dark-blue-main px-8">
    <main class="card-container">
      <article class="card bg-very-dark-blue-card text-white rounded-xl p-6">
        <div class="card-header">
          <img src="./images/image-equilibrium.jpg" alt="image of an NFT" />
        </div>

        <div class="card-body">
          <h1 class="card-title">Equilibrium #3429</h1>
          <p class="card-description">
            Our Equilibrium collection promotes balance and calm.
          </p>

          <div class="card-price">
            <div class="price">
              <img src="./images/icon-ethereum.svg" alt="ethereum icon" />
              <p>0.041 ETH</p>
            </div>
            <div class="time-left">
              <img src="./images/icon-clock.svg" alt="clock icon" />
              <p>3 days left</p>
            </div>
          </div>
        </div>

        <div class="card-footer">
          <div class="img-avatar">
            <img src="./images/image-avatar.png" alt="avatar image" />
          </div>
          <p>Creation of Jules Wyvern</p>
        </div>
      </article>
    </main>

    <footer class="text-center text-sm">
      <p>
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          class="text-blue-footer"
          >Frontend Mentor</a
        >. Coded by
        <a
          href="https://www.linkedin.com/in/muhammad-fachrezi-barus/"
          class="text-blue-footer"
          >Fachrezi</a
        >.
      </p>
    </footer>
  </body>
</html>
