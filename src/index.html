<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png" />

    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body
    class="font-outfit flex flex-col justify-center items-center min-h-screen bg-very-dark-blue-main px-8">
    <main>
      <article
        class="bg-very-dark-blue-card text-white rounded-xl p-6 md:max-w-md lg:max-w-md">
        <div class="relative group">
          <img
            src="./images/image-equilibrium.jpg"
            alt="image of an NFT"
            class="rounded-lg w-full h-auto" />
          <div
            class="absolute inset-0 bg-cyan opacity-0 group-hover:opacity-70 rounded-lg flex justify-center items-center transition-opacity duration-300 hover:cursor-pointer">
            <img
              src="./images/icon-view.svg"
              alt="view icon"
              class="opacity-0 group-hover:opacity-100 transition-opacity duration-300" />
          </div>
        </div>

        <div class="flex flex-col mt-7 pb-5 border-b border-white">
          <h1
            class="text-xl font-medium hover:text-cyan hover:cursor-pointer md:text-2xl">
            Equilibrium #3429
          </h1>
          <p class="text-base font-extralight text-soft-blue mt-2 md:text-lg">
            Our Equilibrium collection promotes balance and calm.
          </p>

          <div class="flex flex-row justify-between mt-5">
            <div class="flex flex-row items-center gap-2">
              <img
                src="./images/icon-ethereum.svg"
                alt="ethereum icon"
                class="object-cover w-3 md:w-5" />
              <p class="text-cyan md:text-lg">0.041 ETH</p>
            </div>
            <div class="flex flex-row items-center gap-2">
              <img
                src="./images/icon-clock.svg"
                alt="clock icon"
                class="object-cover w-5 md:w-9" />
              <p class="md:text-lg">3 days left</p>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-4 mt-8">
          <div class="w-8 md:w-12">
            <img
              src="./images/image-avatar.png"
              alt="avatar image"
              class="border border-white rounded-full" />
          </div>
          <p class="text-soft-blue font-extralight md:text-lg">
            Creation of
            <span class="text-white hover:cursor-pointer hover:text-cyan"
              >Jules Wyvern</span
            >
          </p>
        </div>
      </article>
    </main>

    <footer class="text-center text-sm text-white mt-5 font-light">
      <p class="font-extralight">
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          class="text-blue-footer font-normal hover:font-bold"
          >Frontend Mentor</a
        >. Coded by
        <a
          href="https://www.linkedin.com/in/muhammad-fachrezi-barus/"
          class="text-blue-footer font-normal hover:font-bold"
          >Fachrezi</a
        >.
      </p>
    </footer>
  </body>
</html>
